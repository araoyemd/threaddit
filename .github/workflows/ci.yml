# Runs on every push and pull request: all tests, the app build and the public site build.
name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the backend
        run: deno check index.tsx
        working-directory: supabase/functions/server
      - run: npm ci
        working-directory: web
      - run: npx next build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
