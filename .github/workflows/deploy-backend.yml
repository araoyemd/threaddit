# Deploys the Supabase backend (supabase/functions/server) when it changes on main.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase dashboard → Account → Access Tokens).
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'drrydzbxdwuapiaurkdp' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Never deploy a backend whose rules fail the tests
      - run: npm ci
      - run: npm test
      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (see README → Going live)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy make-server-8937b06c --project-ref "$PROJECT_REF"
