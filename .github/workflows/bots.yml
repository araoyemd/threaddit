# Runs the Threadit bots every hour (news, discussions, welcomes, answers, nudges).
# Needs one repository secret: THREADIT_BOT_SECRET (the same value set on the Supabase function).
# Run it by hand from the Actions tab with "Run workflow".
name: Run bots

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Optional: only these jobs, comma-separated (news,gist,welcome,answer,helper)'
        required: false

concurrency:
  group: bots
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the bot endpoint
        env:
          BOT_SECRET: ${{ secrets.THREADIT_BOT_SECRET }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'drrydzbxdwuapiaurkdp' }}
          # Public anon key (also in utils/supabase/info.tsx). Override with the SUPABASE_ANON_KEY variable.
          ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRycnlkemJ4ZHd1YXBpYXVya2RwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMTg1ODksImV4cCI6MjA5ODc5NDU4OX0.7wG3ga38Itju07_m54XwjlVmAutD3UychORAjv43H-Q' }}
          JOBS: ${{ github.event.inputs.jobs }}
        run: |
          if [ -z "$BOT_SECRET" ]; then
            echo "::error::Add the THREADIT_BOT_SECRET repository secret (see README → Going live)."
            exit 1
          fi
          if [ -n "$JOBS" ]; then
            BODY=$(jq -cn --arg j "$JOBS" '{jobs: ($j | split(",") | map(gsub("^\\s+|\\s+$"; "")))}')
          else
            BODY='{}'
          fi
          curl -sS --fail-with-body --max-time 280 \
            -X POST "https://$PROJECT_REF.supabase.co/functions/v1/make-server-8937b06c/bots/run" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "x-bot-secret: $BOT_SECRET" \
            -d "$BODY" | tee report.json
          echo
          jq -r '"Posted: \(.news.posted) news, \(.gist.posted) discussions, \(.welcome.commented) welcomes, \(.answer.answered // 0) answers, \(.helper.commented) nudges\(if .paused then " (paused)" else "" end)"' report.json >> "$GITHUB_STEP_SUMMARY"
